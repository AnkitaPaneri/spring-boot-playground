# Server configuration
server.port=8080

# Application name
spring.application.name=kyc-fica-verification-system

# Logging configuration
logging.level.root=INFO
logging.level.com.ankita.playground=DEBUG

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics

# Database configuration
spring.datasource.url=jdbc:h2:mem:kycficadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security configuration
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

# JWT configuration
jwt.secret=kycFicaSecretKey2025VerificationSystemSecureTokenSigningKey
jwt.expiration=86400000

# API configuration
api.prefix=/api

# OpenAPI configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
